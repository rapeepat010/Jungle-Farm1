<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a3d0a center / cover no-repeat; /* พื้นหลังเต็มจอ */
  }

  /* เวทีขนาดอ้างอิง 1920x1080 (เท่ากับรูป 2.png) แล้วย่อ/ขยายให้เต็มจอด้วย JS */
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1920px;
    height: 1080px;
    background: center / 100% 100% no-repeat;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    user-select: none;
    -webkit-user-select: none;
  }

  /* ตัวเลขในกล่องเขียว (กล่องกว้าง 272px สูง 272px ตามรูป) */
  .value {
    position: absolute;
    top: 296px;
    width: 272px;
    height: 272px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Lilita One", "Arial Black", Impact, sans-serif;
    font-size: 66px;
    line-height: 1;
    color: #000;
    pointer-events: none;
  }
  #v0 { left: 140px; }
  #v1 { left: 545px; }
  #v2 { left: 978px; }
  #v3 { left: 1444px; }

  /* ปุ่ม toggle */
  .toggle {
    position: absolute;
    height: 71px;
    border-radius: 36px;
    background: #c9ced9;
    cursor: pointer;
    touch-action: none;
    outline: none;
  }
  .toggle:focus-visible { box-shadow: 0 0 0 4px rgba(255, 201, 58, .85); }

  .knob {
    position: absolute;
    top: 0;
    left: 0;
    width: 72px;
    height: 72px;
    margin-top: -0.5px;
    border-radius: 50%;
    background: #ffc93a;
    border: 6px solid #b01c48;
    box-shadow: 7px 4px 8px rgba(120, 110, 140, .28);
    transition: left .22s ease;
  }
  .toggle.dragging .knob { transition: none; }

  #t0 { left: 185px;  top: 582px; width: 193px; }
  #t1 { left: 582px;  top: 580px; width: 188px; }
  #t2 { left: 1017px; top: 582px; width: 194px; }
  #t3 { left: 1480px; top: 580px; width: 192px; }

<body>

<div id="stage">
  <div class="value" id="v0">15</div>
  <div class="value" id="v1">20</div>
  <div class="value" id="v2">50</div>
  <div class="value" id="v3">30</div>

  <div class="toggle" id="t0" role="switch" aria-checked="false" aria-label="°C" tabindex="0"><div class="knob"></div></div>
  <div class="toggle" id="t1" role="switch" aria-checked="false" aria-label="%RH" tabindex="0"><div class="knob"></div></div>
  <div class="toggle" id="t2" role="switch" aria-checked="false" aria-label="CD" tabindex="0"><div class="knob"></div></div>
  <div class="toggle" id="t3" role="switch" aria-checked="false" aria-label="CM" tabindex="0"><div class="knob"></div></div>
</div>

<script>
(function () {
  /* ---------- 1) ย่อ/ขยายเวทีให้เต็มหน้าจอ (cover) ---------- */
  var stage = document.getElementById("stage");
  function fit() {
    var s = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  /* ---------- 2) สุ่มตัวเลข (ตำแหน่งคงเดิม เปลี่ยนเฉพาะค่า) ---------- */
  var ranges = [
    [15, 40],  // °C
    [20, 90],  // %RH
    [0, 100],  // CD
    [0, 100]   // CM
  ];
  function rand(i) {
    var r = ranges[i];
    return Math.floor(Math.random() * (r[1] - r[0] + 1)) + r[0];
  }
  var values = [];
  for (var i = 0; i < 4; i++) {
    values[i] = document.getElementById("v" + i);
    values[i].textContent = rand(i);
  }

  /* ---------- 3) ปุ่ม toggle: กดคลิก, ลาก, หรือกด Space/Enter ----------
     ปิด (ซ้าย)  = ค่าหยุดนิ่ง
     เปิด (ขวา)  = สุ่มค่าใหม่ทุก 1 วินาที                              */
  var KNOB = 72;
  var timers = [];

  function setState(tg, on, idx) {
    var knob = tg.firstElementChild;
    tg.setAttribute("aria-checked", on ? "true" : "false");
    tg.dataset.on = on ? "1" : "0";
    knob.style.left = (on ? tg.offsetWidth - KNOB : 0) + "px";
    clearInterval(timers[idx]);
    if (on) {
      values[idx].textContent = rand(idx);
      timers[idx] = setInterval(function () {
        values[idx].textContent = rand(idx);
      }, 1000);
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll(".toggle"), function (tg, idx) {
    var knob = tg.firstElementChild;
    var dragging = false, moved = false, startX = 0, startLeft = 0;

    function scale() {
      return tg.getBoundingClientRect().width / tg.offsetWidth || 1;
    }

    tg.addEventListener("pointerdown", function (e) {
      dragging = true; moved = false;
      startX = e.clientX;
      startLeft = parseFloat(knob.style.left) || 0;
      tg.classList.add("dragging");
      tg.setPointerCapture(e.pointerId);
    });

    tg.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dx = (e.clientX - startX) / scale();
      if (Math.abs(dx) > 4) moved = true;
      var max = tg.offsetWidth - KNOB;
      knob.style.left = Math.min(max, Math.max(0, startLeft + dx)) + "px";
    });

    function end(e) {
      if (!dragging) return;
      dragging = false;
      tg.classList.remove("dragging");
      var on;
      if (moved) {
        var pos = parseFloat(knob.style.left) || 0;
        on = pos > (tg.offsetWidth - KNOB) / 2;
      } else {
        on = tg.dataset.on !== "1"; // คลิกเฉย ๆ = สลับสถานะ
      }
      setState(tg, on, idx);
    }
    tg.addEventListener("pointerup", end);
    tg.addEventListener("pointercancel", end);

    tg.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        setState(tg, tg.dataset.on !== "1", idx);
      }
    });

    setState(tg, false, idx); // เริ่มต้นปิดอยู่ทางซ้าย เหมือนในรูป
  });
})();
</script>
</body>
</html>
